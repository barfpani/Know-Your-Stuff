<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Know Your Stuff</title>

    <link rel="stylesheet" href="popup.css">

    <script src="../assets/chart.umd.min.js"></script>
</head>
<body>

<div class="container">

    <header>
        <h1>Know Your Stuff</h1>
    </header>

    <section class="product-section">

        <h2 id="product-name">
            Loading...
        </h2>

        <p id="current-price"
            class="current-price">
            Loading...
        </p>

        <strong id="availability">
            Loading...
        </strong>

        <strong id="product-url">
            Loading...
        </strong>

        <strong id="status-text">
            Detecting product...
        </strong>

    </section>

    <section class="stats">

        <div class="stat-card">
            <span>Lowest</span>
            <strong id="lowest-price">
                Unable to Load
            </strong>
        </div>

        <div class="stat-card">
            <span>Highest</span>
            <strong id="highest-price">
                Unable to Load
            </strong>
        </div>

    </section>

    <section class="chart-section">

        <canvas id="priceChart"></canvas>

    </section>

    <section class="recommendation">

        <h3>Recommendation</h3>

        <div class = "recommendation-meta">
            <div id="recommendation-badge" class="badge wait"> -- </div>
            <div id="confidence-score" class="score"> --</div>
        </div>

        <p id="recommendation-text">

            No recommendation available at this time.

        </p>

    </section>

    <footer>

        Last Updated:
        <span id="last-updated">
            Just Now
        </span>

    </footer>

</div>

<script src="popup.js"></script>

</body>
</html>
